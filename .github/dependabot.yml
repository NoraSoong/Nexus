version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/adapters/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    groups:
      production-updates:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-updates:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
