name: Release Developer Preview

on:
  push:
    tags:
      - "v0.1.0-preview.*"

permissions:
  contents: write

jobs:
  release:
    name: Build Apple Silicon DMG
    # Swift tools 6.0 requires the Swift 6 toolchain provided by macOS 15.
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: adapters/mcp/package-lock.json

      - name: Build preview package
        env:
          NEXUS_RUNTIME_CACHE: ${{ runner.temp }}/nexus-runtime-cache
        run: |
          scripts/build-preview.sh
          scripts/verify-preview.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/preview/Nexus-*.dmg \
            dist/preview/SHA256SUMS \
            --title "Nexus $GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes
